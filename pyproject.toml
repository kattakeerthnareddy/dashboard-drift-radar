[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboard-drift-radar"
version = "0.1.0"
description = "Gates warehouse schema migrations on BI blast radius: extracts table/column references from Tableau workbooks and Power BI models, diffs them against the live schema, and fails CI naming exactly which dashboards break."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Keerthana Reddy Katta", email = "kattakeerthanareddy@gmail.com" }]
dependencies = ["duckdb>=1.0", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
ddr = "ddr.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.ruff.lint.per-file-ignores]
"src/ddr/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
